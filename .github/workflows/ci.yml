# The whole suite, and the pixel gate: the four built-in themes stay pixel-identical to their
# reference captures. The runner image is pinned because the
# references are rasterised by this environment's own font stack; a runner bump that shifts
# antialiasing is a real change, and regenerating the references is the deliberate answer to
# it: download the fidelity artifact and commit its four PNGs as tests/fidelity/*.png. The run
# that produces them is the red one — a deliberate change is what made it red — so read its log
# first. Only "differs from its reference" is the drift being refreshed; "two captures in one
# run differ" is the capture having stopped being deterministic, and no reference fixes that.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Mailbox.Tests/Mailbox.Tests.csproj

  doors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install a display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Open every door
        run: xvfb-run -a tools/audit-ci.sh
      - name: Upload the batch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: doors
          path: artifacts/audit/phaseci/
          if-no-files-found: error

  fidelity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install a display and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick
      - name: Pixel gate
        run: xvfb-run -a tools/fidelity-gate.sh
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fidelity
          path: artifacts/fidelity/
          if-no-files-found: error
